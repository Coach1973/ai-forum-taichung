<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI微論壇 台中場｜活動延後公告</title>
<meta name="description" content="AI微論壇台中場（原訂2026年9月23-24日）因報名人數不足，論壇延後舉辦，新日期確定後將另行公告。" />

<style>
:root{
--bg:#f6f1e8;
--paper:rgba(255,255,255,.9);
--text:#241f1a;
--muted:#5b5148;
--muted-2:#7d6d5c;
--line:#dfcfbb;
--accent:#9b5b3f;
--accent-2:#c8845b;
--gold:#b9956b;
--max:720px;
--shadow:0 20px 60px rgba(89,67,46,.10);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 16px}
a{text-decoration:none;color:var(--accent);font-weight:800}
.container{width:min(var(--max),100%)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:48px 36px;text-align:center}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:900;color:#8a6844;margin-bottom:14px}
h1{font-size:clamp(26px,4.5vw,36px);font-weight:900;line-height:1.3;margin:0 0 18px;letter-spacing:-.01em}
.notice{font-size:17px;color:var(--muted);margin:0 0 8px}
.date-old{font-size:14px;color:var(--muted-2);margin:20px 0 0;padding-top:20px;border-top:1px dashed var(--line)}
.btn-row{margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 28px;border-radius:999px;font-weight:900;border:1px solid var(--gold);background:#fff;color:#6b5134;font-size:15px}
footer{margin-top:30px;text-align:center;color:var(--muted-2);font-size:13px}
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="eyebrow">🎤 AI微論壇・台中場</div>
    <h1>活動延後舉辦</h1>
    <p class="notice">由於報名人數不足，故論壇延後舉辦。</p>
    <p class="notice">新的舉辦日期確定後，會在這裡跟官方 LINE 另行公告，謝謝您的支持與體諒。</p>
    <p class="date-old">原訂日期：2026 年 9 月 23 日（三）、24 日（四）｜沃茲新創空間忠明館</p>
    <div class="btn-row">
      <a href="https://lin.ee/xQcrhfZ" target="_blank" rel="noopener" class="btn">加官方 LINE 追蹤新場次公告 →</a>
    </div>
  </div>
  <footer>AI微論壇・台中場｜© 2026 大樹小講</footer>
</div>

</body>
</html>
